# gitleaks configuration: the default rules plus what this repo must never contain
# (home IP, serial numbers, datalogger password).
title = "cold-reserve"

[extend]
useDefault = true

[[rules]]
id = "private-ipv4"
description = "Private IPv4 address (the home network must never reach the repo)"
regex = '''\b(?:10(?:\.\d{1,3}){3}|192\.168(?:\.\d{1,3}){2}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2})\b'''
keywords = ["10.", "192.168.", "172."]

[[rules]]
id = "password-assignment"
description = "Password-like assignment with a value"
regex = '''(?i)(?:password|passwd)\w*\s*[:=]\s*['"]?[^\s'"]{8,}'''
keywords = ["password", "passwd"]

[allowlist]
description = "Lockfile hashes and generated artifacts"
paths = ['''pnpm-lock\.yaml''', '''(^|/)cdk\.out/''', '''(^|/)generated/''']
